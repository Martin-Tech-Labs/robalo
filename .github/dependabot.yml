version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "nuget"
    directories:
      - "/"
      - "/src/*"
      - "/test/*"
    schedule:
      interval: "weekly"
    groups:
      nuget-by-package:
        patterns:
          - "*"
        group-by: dependency-name

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-by-package:
        patterns:
          - "*"
        group-by: dependency-name

  - package-ecosystem: "docker"
    directories:
    - "/**/*"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
