name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    uses: ./.github/workflows/unit-tests.yml

  integration-tests:
    uses: ./.github/workflows/integration-tests.yml

  acceptance-tests:
    uses: ./.github/workflows/acceptance-tests.yml

  deploy:
    permissions:
      contents: read
      security-events: write
    needs: [unit-tests, integration-tests, acceptance-tests]
    name: Publish Controller
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Cake uses GitVersion.
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build Docker
        run: dotnet run cake.cs -- --target=BuildContainerController --configuration=Release

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1

      - name: Scan Docker
        run: dotnet run cake.cs -- --target=ScanContainerController --configuration=Release

      - name: Publish Trivy findings
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy/robalo-controller.sarif
          category: trivy-image
   
      - name: Push Docker
        if: github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: dotnet run cake.cs -- --target=PushContainerController --configuration=Release
