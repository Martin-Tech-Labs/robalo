name: Integration Tests

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Cake uses GitVersion.
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      
      - name: Start dependencies
        run: docker compose up -d seq --wait --wait-timeout 30

      - name: Integration Tests
        run: dotnet run cake.cs -- --target=IntegrationTests --configuration=Release

      - name: Create test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Integration Test Results
          path: "TestResults/*.trx"
          reporter: dotnet-trx
          use-actions-summary: true
          report-title: Integration Tests Results 
        
      - name: Collect Docker logs on failure
        if: failure()
        uses: step-security/gh-docker-logs@v2

      - name: Generate coverage report
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.11
        with:
          reports: "TestResults/*.cobertura.xml"
          targetdir: CoverageReport
          reporttypes: "Html;MarkdownSummaryGithub"
        
      - name: Publish coverage summary
        if: always()
        shell: bash
        run: cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"