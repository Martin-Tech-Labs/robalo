name: Acceptance Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Cake uses GitVersion.
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'

      - name: Install acceptance test dependencies
        run: npm ci

      - name: Start the full application stack
        run: docker compose up --detach --build

      - name: Wait for the Controller
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --max-time 5 http://localhost:5010/_system/ping > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Service did not become ready: http://localhost:5010/_system/ping"
          exit 1

      - name: Run acceptance tests
        env:
          ENVIRONMENT: local
        run: |
          mkdir -p TestResults
          npm test -- --timeout 30000 --reporter json --reporter-option output=TestResults/acceptance.json

      - name: Publish test summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = Path("TestResults/acceptance.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Acceptance test results\n\n")
              if report.exists():
                  stats = json.loads(report.read_text())["stats"]
                  summary.write(", ".join(
                      f"{key}: {stats.get(key, 0)}"
                      for key in ("tests", "passes", "failures", "pending")
                  ) + "\n\n")
              else:
                  summary.write("No report was produced. Check startup and test logs.\n\n")
              summary.write("Full reports and Compose logs are available in this run's artifacts.\n")
          PY

      - name: Collect Compose diagnostics
        if: always()
        run: |
          mkdir -p TestResults
          docker compose ps --all > TestResults/compose-status.log 2>&1
          docker compose logs --no-color > TestResults/compose.log 2>&1

      - name: Stop Compose
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Upload reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-test-results
          path: TestResults/
          if-no-files-found: warn
