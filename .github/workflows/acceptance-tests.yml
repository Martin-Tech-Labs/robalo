name: Acceptance Tests

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Cake uses GitVersion.
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Start compose
        run: docker compose up -d --wait --wait-timeout 30

      - name: Acceptance Tests
        run: dotnet run cake.cs -- --target=AcceptanceTests --configuration=Release
        
      - name: Collect Docker logs on failure
        if: failure()
        uses: step-security/gh-docker-logs@v2
  