services:
  controller:
    build:
      context: .
      dockerfile: src/Robalo.Controller.Api/Dockerfile
    ports:
      - "5010:5010"
    volumes:
      - ./data:/data
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 5010
      ASPNETCORE_PATHBASE: /controller
      ROBALO_Serilog__WriteTo__1__args__serverURL: http://seq:5341
      ROBALO_Database__Database: /data/robalo.db
      ROBALO_Database__Password: "12345678"
      ROBALO_Llm__Model: test-model
      ROBALO_Llm__Endpoint: http://ollama:11434/v1/
      ROBALO_Llm__Key: test

  seq:
    image: datalust/seq:2026.1.17182
    ports:
      - "127.0.0.1:8081:80"
      - "127.0.0.1:5341:5341"
    environment:
      # Starting Seq with this setting accepts https://datalust.co/doc/eula.
      ACCEPT_EULA: "Y"
      # Local development only; host ports are bound to loopback.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    volumes:
      - seq-data:/data
    healthcheck:
      test: "/seqsvr/Client/seqcli node health -s http://localhost"
      interval: 15s
      timeout: 10s
      retries: 2
      start_period: 5s

  ollama:
    image: alpine/ollama
    ports:
      - "11500:11434"
    volumes:
      - ./scripts/ollama-setup.sh:/ollama-setup.sh:ro
    post_start:
      - command: sh -c 'sh /ollama-setup.sh > /proc/1/fd/1 2>&1'
    healthcheck:
      test: ollama run test-model Hello
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  seq-data:
