type: object
required:
  - message_id
  - content
  - created_on
  - event_type
  - thread_id
  - message_number
  - _links
properties:
  message_id:
    type: string
  content:
    type: string
  created_on:
    type: string
    format: date-time
  event_type:
    type: string
    enum:
      - UserMessageAdded
      - AssistantMessageAdded
      - BreakMessageAdded
  thread_id:
    type: string
  message_number:
    type: integer
  _links:
    type: object
    required:
      - self
      - thread
      - events
    properties:
      self:
        $ref: './link.yaml'
      thread:
        $ref: './link.yaml'
      events:
        $ref: './link.yaml'
    additionalProperties: false
additionalProperties: false
