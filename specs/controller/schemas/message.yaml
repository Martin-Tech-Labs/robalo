type: object
required:
  - content
  - created_on
  - source
  - thread_id
  - message_id
  - _links
properties:
  content:
    type: string
  created_on:
    type: string
    format: date-time
  source:
    type: string
    enum:
      - user
      - llm
      - controller
  thread_id:
    type: string
  message_id:
    type: string
  _links:
    type: object
    required:
      - self
      - thread
    properties:
      self:
        $ref: './link.yaml'
      thread:
        $ref: './link.yaml'
